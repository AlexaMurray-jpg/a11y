on:
  push:
    branches:
      - main

name: deploy-bookdown

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::ggplot2
            any::rcmdcheck
          needs: |
            website
            coverage

      - name: Install R package dependencies
        run: Rscript -e 'install.packages(c("rmarkdown", "bookdown"))'

      - name: Render book
        run: Rscript -e 'bookdown::render_book("index.Rmd", quiet = TRUE)'

      - name: Render standalone files
        run: Rscript -e 'for (i in list.files("RMD", full.names = TRUE)) {rmarkdown::render(i, output_format = bookdown::html_document2(number_sections = FALSE), output_dir = "_book")}'

      - name: Copy video assets into output
        run: cp -r video _book/video

      - name: Copy html assets into output
        run: cp -r html _book/html

      - name: Copy synth theme into output
        run: cp -r a11y.theme _book

      - name: Copy pandoc supplements into output
        run: cp -r Supplements _book/Supplements

      - name: Upload book as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_book"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
